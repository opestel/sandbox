<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Name Origin Finder</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="card">
      <h1>What's in a name?</h1>
      <p class="subtitle">Enter your first name and we'll look up its origin on Wikipedia.</p>

      <form id="name-form">
        <input
          type="text"
          id="name-input"
          name="name"
          placeholder="e.g. Ada"
          autocomplete="given-name"
          required
        />
        <button type="submit">Find origin</button>
      </form>

      <section id="result" class="result" hidden>
        <h2 id="result-title"></h2>
        <p id="result-extract"></p>
        <a id="result-link" target="_blank" rel="noopener noreferrer">View on Wikipedia →</a>
      </section>

      <p id="error" class="error" hidden></p>
    </main>

    <script src="app.js"></script>
  </body>
</html>
