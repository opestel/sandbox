<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Name Origin Finder</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="card">
      <nav class="site-nav"><a href="/">← Home</a></nav>
      <h1>What's in a name?</h1>
      <p class="subtitle">Enter your first name and we'll look up its origin on Wikipedia.</p>

      <form id="name-form">
        <input
          type="text"
          id="name-input"
          name="name"
          placeholder="e.g. Ada"
          autocomplete="given-name"
          required
        />
        <button type="submit">Find origin</button>
      </form>

      <section id="result" class="result" hidden>
        <h2 id="result-title"></h2>
        <p id="result-extract"></p>
        <a id="result-link" target="_blank" rel="noopener noreferrer">View on Wikipedia →</a>

        <div class="translate-controls">
          <select id="lang-select" aria-label="Translate to">
            <option value="es">Spanish</option>
            <option value="fr">French</option>
            <option value="de">German</option>
            <option value="it">Italian</option>
            <option value="pt">Portuguese</option>
            <option value="nl">Dutch</option>
            <option value="ru">Russian</option>
            <option value="ja">Japanese</option>
            <option value="zh-CN">Chinese (Simplified)</option>
            <option value="ar">Arabic</option>
            <option value="hi">Hindi</option>
            <option value="ko">Korean</option>
          </select>
          <button type="button" id="translate-button">Translate</button>
        </div>
        <p id="translated-extract" class="translated" hidden></p>
      </section>

      <p id="error" class="error" hidden></p>
    </main>

    <script src="app.js"></script>
  </body>
</html>
